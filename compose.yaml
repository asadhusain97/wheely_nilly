name: wheel-dashboard

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVER_HOST: 0.0.0.0
      PYTHON_SIDECAR_URL: http://screener:8000
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  screener:
    profiles:
      - screener
    build:
      context: .
      dockerfile: docker/sidecar.Dockerfile
    environment:
      PORT: 8000
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      SCREENER_PROVIDERS: ${SCREENER_PROVIDERS:-alphavantage,yfinance}
      SCREENER_CACHE_TTL_SECONDS: ${SCREENER_CACHE_TTL_SECONDS:-120}
      SCREENER_MAX_CONCURRENCY: ${SCREENER_MAX_CONCURRENCY:-2}
      SCREENER_TIMEOUT_SECONDS: ${SCREENER_TIMEOUT_SECONDS:-15}
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
